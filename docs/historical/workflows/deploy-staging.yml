name: Deploy Staging

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: agentguard-staging
  NAMESPACE: agentguard
  HELM_RELEASE: agentguard

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run database migrations
        run: |
          kubectl run migration-${{ github.sha }} \
            --image=${{ steps.ecr.outputs.registry }}/agentguard-api:${{ github.sha }} \
            --restart=Never \
            --namespace=${{ env.NAMESPACE }} \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command -- alembic upgrade head
          kubectl wait --for=condition=Complete \
            job/migration-${{ github.sha }} \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=120s || true
          kubectl delete pod migration-${{ github.sha }} \
            --namespace=${{ env.NAMESPACE }} --ignore-not-found

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} \
            infrastructure/k8s/agentguard \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f infrastructure/k8s/agentguard/environments/staging.yaml \
            --set global.imageRegistry=${{ steps.ecr.outputs.registry }} \
            --set api.image.tag=${{ github.sha }} \
            --set worker.image.tag=${{ github.sha }} \
            --set beat.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set externalSecrets.dbSecretArn=${{ secrets.DB_SECRET_ARN }} \
            --set externalSecrets.redisSecretArn=${{ secrets.REDIS_SECRET_ARN }} \
            --set externalSecrets.appSecretArn=${{ secrets.APP_SECRET_ARN }} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-api \
            --namespace=${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-worker \
            --namespace=${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-frontend \
            --namespace=${{ env.NAMESPACE }} --timeout=120s

      - name: Smoke test
        run: |
          API_URL=$(kubectl get ingress ${{ env.HELM_RELEASE }}-ingress \
            --namespace=${{ env.NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${API_URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed"
          exit 1
