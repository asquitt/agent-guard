apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  REGISTRATION_ENABLED: {{ .Values.config.registrationEnabled | quote }}
  LOCAL_REGISTRATION_BYPASS_ENABLED: {{ .Values.config.localRegistrationBypassEnabled | quote }}
  GLOBAL_PROVIDER_CREDENTIAL_FALLBACK_ENABLED: {{ .Values.config.globalProviderCredentialFallbackEnabled | quote }}
  API_PREFIX: {{ .Values.config.apiPrefix | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.accessTokenExpireMinutes | quote }}
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.config.refreshTokenExpireDays | quote }}
  DETECTION_LLM_PROVIDER: {{ .Values.config.detectionLlmProvider | quote }}
  DETECTION_LLM_MODEL: {{ .Values.config.detectionLlmModel | quote }}
  DETECTION_LLM_RPM: {{ .Values.config.detectionLlmRpm | quote }}
  ARCHIVE_STORAGE_PATH: {{ .Values.config.archiveStoragePath | quote }}
  RETENTION_BATCH_SIZE: {{ .Values.config.retentionBatchSize | quote }}
  RETENTION_DRY_RUN: {{ .Values.config.retentionDryRun | quote }}
  ALLOWED_ORIGINS: "https://{{ .Values.global.domain }}"
  FRONTEND_URL: "https://{{ .Values.global.domain }}"
