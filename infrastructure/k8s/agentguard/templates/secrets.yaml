{{- if .Values.externalSecrets.dbSecretArn }}
# ExternalSecret CRDs — pulls secrets from AWS Secrets Manager into K8s Secrets.
# Requires: external-secrets operator installed in the cluster.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.dbSecretArn }}
        property: connection_string
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-redis-secret
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.redisSecretArn }}
        property: url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-app-secret
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretArn }}
        property: secret_key
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretArn }}
        property: encryption_key
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretArn }}
        property: stripe_secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretArn }}
        property: stripe_webhook_secret
    - secretKey: SENTRY_DSN
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretArn }}
        property: sentry_dsn
{{- end }}
