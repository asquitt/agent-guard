# Default values for agentguard Helm chart.
# Override per environment in environments/staging.yaml or environments/production.yaml.

global:
  environment: staging
  domain: staging.agentguard.app
  imageRegistry: ""  # Set to ECR URL: 123456789.dkr.ecr.us-east-1.amazonaws.com

# --- API ---
api:
  replicaCount: 2
  image:
    repository: agentguard-api
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  probes:
    readiness:
      path: /health
      port: 8000
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      path: /health
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 20
  service:
    port: 8000
    type: ClusterIP
  pdb:
    minAvailable: 1

# --- Worker (Celery) ---
worker:
  replicaCount: 2
  image:
    repository: agentguard-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilization: 75
  pdb:
    minAvailable: 1
  command:
    - celery
    - -A
    - app.tasks.celery_app
    - worker
    - --loglevel=info
    - --concurrency=4

# --- Beat (Celery scheduler) ---
beat:
  replicaCount: 1
  image:
    repository: agentguard-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  command:
    - celery
    - -A
    - app.tasks.celery_app
    - beat
    - --loglevel=info

# --- Frontend (Next.js via Nginx) ---
frontend:
  replicaCount: 2
  image:
    repository: agentguard-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 75
  service:
    port: 3000
    type: ClusterIP
  pdb:
    minAvailable: 1

# --- Ingress (AWS ALB) ---
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/idle-timeout: "120"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120

# --- External secrets (from AWS Secrets Manager) ---
externalSecrets:
  dbSecretArn: ""
  redisSecretArn: ""
  appSecretArn: ""

# --- Config (non-secret environment variables) ---
config:
  appName: AgentGuard
  debug: "false"
  apiPrefix: /api/v1
  logLevel: info
  accessTokenExpireMinutes: "30"
  refreshTokenExpireDays: "7"
  detectionLlmProvider: openai
  detectionLlmModel: gpt-4o-mini
  detectionLlmRpm: "60"
  archiveStoragePath: /app/archives
  retentionBatchSize: "500"
  retentionDryRun: "false"

# --- Network policies ---
networkPolicies:
  enabled: true
