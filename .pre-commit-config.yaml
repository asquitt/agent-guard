# Pre-commit hooks for AgentGuard
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: Format Python (Black)
        language_version: python3
        files: ^agentguard-backend/backend/app/
        args: ['--check', '--diff']

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports (isort)
        files: ^agentguard-backend/backend/app/
        args: ['--check-only', '--diff', '--profile', 'black', '-p', 'app']

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python (flake8)
        files: ^agentguard-backend/backend/app/
        args:
          - '--max-line-length=120'
          - '--extend-ignore=E501,W503,E203'
          - '--exclude=__pycache__,migrations,venv'

  # Local hooks
  - repo: local
    hooks:
      # Model import checker - prevents schema drift
      - id: check-model-imports
        name: Check model imports
        entry: bash -c 'cd agentguard-backend/backend && python scripts/check_model_imports.py'
        language: system
        files: ^agentguard-backend/backend/app/models/
        pass_filenames: false

      # File size limit - prevents tech debt
      - id: file-size-limit
        name: Check file size (800 line limit)
        entry: >-
          bash -c 'files=$(git diff --cached --name-only --diff-filter=AM |
          grep "\.py$" | grep -E "agentguard-backend/backend/app/" || true);
          if [ -n "$files" ]; then for f in $files; do
          lines=$(wc -l < "$f" 2>/dev/null || echo 0);
          if [ "$lines" -gt 800 ]; then
          echo "BLOCKED - $f exceeds 800 lines ($lines). Split into multiple files.";
          exit 1; fi; done; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Backend type checking
      - id: backend-typecheck
        name: Type check backend (pyright)
        entry: bash -c 'cd agentguard-backend/backend && python -m pyright app/ --level warning || true'
        language: system
        files: ^agentguard-backend/backend/
        types: [python]
        pass_filenames: false

      # Frontend type checking
      - id: frontend-typecheck
        name: Type check frontend (tsc)
        entry: bash -c 'cd agentguard-frontend && npx tsc --noEmit 2>/dev/null || true'
        language: system
        files: ^agentguard-frontend/src/
        types: [ts, tsx]
        pass_filenames: false

      # Duplicate constant detector (frontend)
      - id: no-duplicate-constants
        name: No duplicate color constants in pages
        entry: >-
          bash -c 'if git diff --cached --name-only |
          xargs grep -l -E "const (SEVERITY_COLORS|STATUS_COLORS)" 2>/dev/null |
          grep -E "agentguard-frontend/src/app/"; then
          echo "BLOCKED: color constants must be imported from lib/constants.ts"; exit 1; fi'
        language: system
        files: ^agentguard-frontend/src/app/
        pass_filenames: false
        stages: [pre-commit]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        # Helm templates contain Go template expressions and are not plain YAML.
        exclude: ^infrastructure/k8s/[^/]+/templates/.*\.ya?ml$
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict

ci:
  autofix_commit_msg: 'style: auto-fix from pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
