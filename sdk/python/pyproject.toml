[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.2.0"
description = "Archived source preview client for an explicit AgentGuard deployment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary - All Rights Reserved" }
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: Other/Proprietary License",
]
dependencies = ["httpx>=0.24.0,<1"]

[project.optional-dependencies]
openai = ["openai>=2.15.0,<3"]
anthropic = ["anthropic>=0.75.0,<1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "respx>=0.20"]
